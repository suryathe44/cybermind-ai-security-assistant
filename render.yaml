services:
  - type: web
    name: cybermind-ai-security-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: CERTIFICATE_SECRET
        generateValue: true
      - key: INSTRUCTOR_TOKEN
        generateValue: true
