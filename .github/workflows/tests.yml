name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check live Render service
        run: |
          base=https://cybermind-ai-security-assistant.onrender.com
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 30 "$base/health" | grep -q '"ok"' \
              && curl --fail --silent --show-error --max-time 30 "$base/api/assessment" | grep -q 'passing_score' \
              && curl --fail --silent --show-error --max-time 30 "$base/" | grep -q 'FINAL ASSESSMENT'; then
              exit 0
            fi
            sleep 20
          done
          exit 1
